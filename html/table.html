<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shanghai Rummy - Table</title>
<link rel="stylesheet" href="../css/table.css" />
</head>
<body>
  <div id="table-container">
    <div id="drawPile" class="pile"></div>
    <div id="discardPile" class="pile">Discard</div>
    <div id="playersContainer"></div>
    <div id="contractsContainer"></div>
  </div>

  <!-- Load order is strict: each file depends only on those above it. -->
  <script src="../js/gameState.js"></script>
  <script src="../js/validator.js"></script>
  <script src="../js/initDeck.js"></script>
  <script src="../js/scoring.js"></script>
  <script src="../js/cardRenderer.js"></script>
  <script src="../js/dragDrop.js"></script>
  <script src="../js/aiEngine.js"></script>
  <script src="../js/roundManager.js"></script>

  <script>
    // Guard: if setup was skipped (direct navigation), redirect rather than crash.
    (function() {
      const gs = localStorage.getItem('gameSetup');
      if (!gs) { window.location.href = 'setup.html'; return; }
      let setup;
      try { setup = JSON.parse(gs); }
      catch (e) { window.location.href = 'setup.html'; return; }
      if (!setup?.playerNames?.length) { window.location.href = 'setup.html'; return; }
      window.initTable(setup.playerNames);
    })();
  </script>
</body>
</html>
